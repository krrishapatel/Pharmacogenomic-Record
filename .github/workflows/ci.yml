name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject declares, so the claim gets tested.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # A non-editable install is a separate risk: the reference tables are found
  # with importlib.resources, so packaging them wrong only breaks the wheel.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --wheel
      - run: pip install dist/*.whl
      - run: pharmacogenomic-record --help

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned, so a new ruff release cannot turn this red without a change
      # here. The rule set is pinned in pyproject for the same reason.
      - run: pip install ruff==0.15.20
      - run: ruff check .
